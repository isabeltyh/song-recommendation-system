<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Song Recommender</h1>
            <p>Discover your next favorite track</p>
        </header>

        <!-- Mode Switcher -->
        <div class="mode-switcher">
            <button id="btn-discover-mode" class="active" onclick="switchMode('discover')">Discover</button>
            <button id="btn-recommend-mode" onclick="switchMode('recommend')">Get Similar Songs</button>
            <button id="btn-search-mode" onclick="switchMode('search')">Search Artists</button>
        </div>

        <!-- Recommendation Form -->
        <div id="recommend-form" class="card hidden">
            <label for="song-title">Find songs similar to...</label>
            <input type="text" id="song-title" placeholder="e.g. Shape of You">
            <input type="hidden" id="genre-select" value="All Genres">
            <label for="count-input">How many?</label>
            <input type="text" id="count-input" value="10">
            <button onclick="getRecommendations()">Recommend</button>
        </div>

        <!-- Search Form -->
        <div id="search-form" class="card hidden">
            <label for="artist-search">Search by Artist</label>
            <input type="text" id="artist-search" placeholder="e.g. Taylor Swift" onkeypress="if(event.key === 'Enter') searchByArtist()">
            <button onclick="searchByArtist()">Search</button>
        </div>

        <div id="message" class="hidden"></div>

        <!-- Results Container -->
        <h3 id="results-title" class="hidden" style="margin-top: 40px;">Discover New Music</h3>
        <div id="results" class="song-grid"></div>
    </div>

    <script>
        // Initial load: show random songs
        window.onload = () => {
            loadDiscoverFeed();
        };

        function switchMode(mode) {
            // Reset buttons
            document.getElementById('btn-discover-mode').classList.remove('active');
            document.getElementById('btn-recommend-mode').classList.remove('active');
            document.getElementById('btn-search-mode').classList.remove('active');
            document.getElementById('btn-' + mode + '-mode').classList.add('active');
            
            // Hide all forms
            document.getElementById('recommend-form').classList.add('hidden');
            document.getElementById('search-form').classList.add('hidden');
            clearResults();

            // Show selected form
            if(mode === 'discover') {
                loadDiscoverFeed();
            } else if(mode === 'recommend') {
                document.getElementById('recommend-form').classList.remove('hidden');
                document.getElementById('results-title').textContent = "Similar Songs";
            } else if(mode === 'search') {
                document.getElementById('search-form').classList.remove('hidden');
                document.getElementById('results-title').textContent = "Artist Search";
            }
        }

        function clearResults() {
            document.getElementById('message').className = 'hidden';
            document.getElementById('results').innerHTML = '';
            document.getElementById('results-title').className = 'hidden';
        }

        function createSongCard(s) {
            const div = document.createElement('div');
            div.className = 'song-card';
            const imgSrc = s.cover ? s.cover : 'https://via.placeholder.com/150?text=No+Art';
            
            div.innerHTML = `
                <img src="${imgSrc}" alt="Album Art" class="album-art">
                <div class="song-info">
                    <h4>${s.title}</h4>
                    <div class="artist">${s.artist}</div>
                    ${s.score ? `<div class="score-badge">Score: ${s.score}/100</div>` : ''}
                </div>
            `;
            return div;
        }

        function loadDiscoverFeed() {
            clearResults();
            document.getElementById('results-title').textContent = "Discover New Music";
            document.getElementById('results-title').classList.remove('hidden');
            
            fetch('/api/discover')
                .then(r => r.json())
                .then(data => {
                    const resultsEl = document.getElementById('results');
                    data.results.forEach(s => resultsEl.appendChild(createSongCard(s)));
                });
        }

        function getRecommendations() {
            clearResults();
            const songTitle = document.getElementById('song-title').value.trim();
            const countRaw = document.getElementById('count-input').value.trim();

            if(!songTitle) {
                const msg = document.getElementById('message');
                msg.className = 'error';
                msg.textContent = "Please enter a song title.";
                return;
            }

            fetch('/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ song_title: songTitle, genre: "all", count: countRaw })
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    const msg = document.getElementById('message');
                    msg.className = 'error';
                    msg.textContent = data.error;
                    return;
                }
                
                document.getElementById('results-title').classList.remove('hidden');
                const resultsEl = document.getElementById('results');
                data.results.forEach(s => resultsEl.appendChild(createSongCard(s)));
            });
        }

        function searchByArtist() {
            clearResults();
            const artist = document.getElementById('artist-search').value.trim();
            if(!artist) return;

            fetch('/api/search_artist?artist=' + encodeURIComponent(artist))
                .then(r => r.json())
                .then(data => {
                    document.getElementById('results-title').textContent = "Songs by " + artist;
                    document.getElementById('results-title').classList.remove('hidden');
                    const resultsEl = document.getElementById('results');
                    
                    if (data.results.length === 0) {
                        resultsEl.innerHTML = '<p style="color:#666;">No songs found for this artist.</p>';
                        return;
                    }
                    data.results.forEach(s => resultsEl.appendChild(createSongCard(s)));
                });
        }
    </script>
</body>
</html>
