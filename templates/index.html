<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand" onclick="switchMode('discover')" style="cursor:pointer;">Song Recommender</div>
        <div class="nav-links">
            <button id="btn-discover-mode" class="nav-btn active" onclick="switchMode('discover')">Discover</button>
            <button id="btn-recommend-mode" class="nav-btn" onclick="switchMode('recommend')">Similar</button>
            <button id="btn-search-mode" class="nav-btn" onclick="switchMode('search')">Search</button>
            <button id="btn-profile-mode" class="nav-btn" onclick="switchMode('profile')">Profile</button>
        </div>
    </nav>

    <div class="container">
        
        <!-- Auth Form -->
        <div id="auth-form" class="card hidden">
            <h2 id="auth-title">Welcome Back</h2>
            <p id="auth-subtitle">Log in to save your favorite songs.</p>
            <label for="auth-username">Username</label>
            <input type="text" id="auth-username" placeholder="Enter username">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" placeholder="Enter password">
            <button onclick="handleAuth()" id="auth-submit-btn">Log In</button>
            <p style="margin-top: 20px; font-size: 0.8rem; cursor: pointer; text-decoration: underline; color: var(--text-muted);" onclick="toggleAuthMode()">
                <span id="auth-toggle-text">Need an account? Sign Up</span>
            </p>
        </div>

        <!-- Recommendation Form -->
        <div id="recommend-form" class="card hidden">
            <h2>Find Similar Songs</h2>
            <label for="song-title">Song Title</label>
            <input type="text" id="song-title" placeholder="e.g. Shape of You">
            <label for="count-input">How many results?</label>
            <input type="text" id="count-input" value="10">
            <button onclick="getRecommendations()">Recommend</button>
        </div>

        <!-- Search Form -->
        <div id="search-form" class="card hidden">
            <h2>Search Library</h2>
            <label for="search-type">Search By</label>
            <select id="search-type" onchange="toggleSearchType()">
                <option value="artist">Artist</option>
                <option value="album">Album</option>
            </select>
            <label for="search-query" id="search-label">Artist Name</label>
            <input type="text" id="search-query" placeholder="e.g. Taylor Swift" onkeypress="if(event.key === 'Enter') executeSearch()">
            <button onclick="executeSearch()">Search</button>
        </div>

        <!-- Profile Page -->
        <div id="profile-form" class="card hidden">
            <h2>Your Profile</h2>
            <p id="profile-greeting">Welcome!</p>
            <button onclick="logoutUser()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); margin-bottom: 30px;">Log Out</button>
            
            <h3 id="results-title" class="hidden" style="margin-top:20px;">Your Liked Songs</h3>
            <div id="results" class="grid-container"></div>
        </div>

        <!-- Main Results Area -->
        <div id="main-results-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-light); padding-bottom: 15px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="back-btn" class="nav-btn" onclick="goBack()" style="display: none; border: 1px solid var(--border-light); padding: 8px 16px; color: var(--text-main);">← Back</button>
                    <h3 id="main-results-title" class="hidden" style="margin: 0; padding: 0; border: none;">Discover New Music</h3>
                </div>
                <button id="refresh-btn" class="nav-btn" onclick="loadDiscoverFeed()" style="display: none; border: 1px solid var(--border-light); padding: 8px 16px; color: var(--text-main);">↻ Refresh</button>
            </div>
            <div id="main-results"></div>
        </div>

    </div>

    <script>
        let isSignupMode = false;
        let currentUser = null;
        let previousMode = 'discover';

        window.onload = () => {
            checkAuth();
            switchMode('discover');
        };

        function checkAuth() {
            fetch('/api/check_auth').then(r => r.json()).then(data => {
                if (data.logged_in) currentUser = data.username;
            });
        }

        function toggleAuthMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('auth-title').textContent = isSignupMode ? "Create Account" : "Welcome Back";
            document.getElementById('auth-submit-btn').textContent = isSignupMode ? "Sign Up" : "Log In";
            document.getElementById('auth-toggle-text').textContent = isSignupMode ? "Already have an account? Log In" : "Need an account? Sign Up";
        }

        function handleAuth() {
            const u = document.getElementById('auth-username').value.trim();
            const p = document.getElementById('auth-password').value.trim();
            const url = isSignupMode ? '/api/signup' : '/api/login';
            
            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            }).then(r => r.json()).then(data => {
                if(data.success) {
                    if(isSignupMode) {
                        alert("Account created! Please log in.");
                        toggleAuthMode();
                    } else {
                        currentUser = data.username;
                        switchMode('profile');
                    }
                } else {
                    alert(data.error);
                }
            });
        }

        function logoutUser() {
            fetch('/api/logout', {method: 'POST'}).then(() => {
                currentUser = null;
                switchMode('discover');
            });
        }

        function switchMode(mode) {
            // Hide all cards and results
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            document.getElementById('main-results-container').classList.add('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('btn-' + mode + '-mode').classList.add('active');
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('refresh-btn').style.display = 'none';

            if (mode === 'discover') {
                document.getElementById('main-results-container').classList.remove('hidden');
                loadDiscoverFeed();
            } else if (mode === 'recommend') {
                document.getElementById('recommend-form').classList.remove('hidden');
            } else if (mode === 'search') {
                document.getElementById('search-form').classList.remove('hidden');
            } else if (mode === 'profile') {
                if (!currentUser) {
                    document.getElementById('auth-form').classList.remove('hidden');
                } else {
                    document.getElementById('profile-form').classList.remove('hidden');
                    document.getElementById('profile-greeting').textContent = "Logged in as " + currentUser;
                    loadLikes();
                }
            }
        }

        function goBack() {
            // When the back button is clicked, go back to the search/recommend form
            if (previousMode === 'search') {
                switchMode('search');
            } else if (previousMode === 'recommend') {
                switchMode('recommend');
            } else {
                switchMode('discover');
            }
        }

        function toggleSearchType() {
            const type = document.getElementById('search-type').value;
            document.getElementById('search-label').textContent = type === 'artist' ? 'Artist Name' : 'Album Name';
        }

        function createSongCard(s, showLikeBtn = true) {
            const div = document.createElement('div');
            div.className = 'song-card';
            
            const scoreHtml = (s.score !== undefined) ? `<span class="score-badge">Score: ${s.score}</span>` : '';
            
            const likeBtnHtml = showLikeBtn ? `
                <button class="like-btn" onclick="toggleLike('${s.title.replace(/'/g, "\\'")}', '${s.artist.replace(/'/g, "\\'")}', this)">♡ Like</button>
            ` : '';

            div.innerHTML = `
                <div class="song-info">
                    <h4>${s.title || 'Unknown Title'}</h4>
                    <div class="artist">${s.artist || 'Unknown Artist'}</div>
                </div>
                <div class="card-actions">
                    ${likeBtnHtml}
                    ${scoreHtml}
                </div>
            `;
            return div;
        }

        function loadDiscoverFeed() {
            document.getElementById('refresh-btn').style.display = 'block';
            document.getElementById('back-btn').style.display = 'none';
            
            fetch('/api/discover').then(r => r.json()).then(data => {
                const el = document.getElementById('main-results');
                el.innerHTML = '';
                document.getElementById('main-results-title').textContent = "Discover New Music";
                document.getElementById('main-results-title').classList.remove('hidden');
                data.results.forEach(s => el.appendChild(createSongCard(s)));
            });
        }

        function getRecommendations() {
            const title = document.getElementById('song-title').value.trim();
            const count = document.getElementById('count-input').value.trim();
            
            if(!title) return alert("Please enter a song title!");

            previousMode = 'recommend';
            document.getElementById('recommend-form').classList.add('hidden');
            document.getElementById('main-results-container').classList.remove('hidden');
            document.getElementById('refresh-btn').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';

            const el = document.getElementById('main-results');
            el.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Searching for similar songs...</p>';
            document.getElementById('main-results-title').classList.remove('hidden');
            document.getElementById('main-results-title').textContent = "Similar to " + title;

            fetch('/api/recommend', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({song_title: title, count: count})
            }).then(r => r.json()).then(data => {
                el.innerHTML = '';
                if(!data.success) {
                    el.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: red;">Error: ${data.error}</p>`;
                    return;
                }
                if(data.results.length === 0) {
                    el.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">No similar songs found for "${title}".</p>`;
                    return;
                }
                data.results.forEach(s => el.appendChild(createSongCard(s)));
            }).catch(err => alert("Recommend Error: " + err));
        }

        function executeSearch() {
            const type = document.getElementById('search-type').value;
            const query = document.getElementById('search-query').value.trim();

            if(!query) return alert("Please enter a search term!");

            previousMode = 'search';
            document.getElementById('search-form').classList.add('hidden');
            document.getElementById('main-results-container').classList.remove('hidden');
            document.getElementById('refresh-btn').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';

            const endpoint = type === 'artist' ? '/api/search_artist?artist=' : '/api/search_album?album=';

            const el = document.getElementById('main-results');
            el.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Searching...</p>';
            document.getElementById('main-results-title').classList.remove('hidden');
            document.getElementById('main-results-title').textContent = `Results for "${query}"`;
            
            fetch(endpoint + encodeURIComponent(query)).then(r => r.json()).then(data => {
                el.innerHTML = '';
                
                if(data.results.length === 0) {
                    el.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                            <p style="font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--text-muted); margin-bottom: 10px;">No matches found</p>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">Try a different spelling or search term.</p>
                        </div>
                    `;
                    return;
                }
                
                data.results.forEach(s => el.appendChild(createSongCard(s)));
            }).catch(err => alert("Search Error: " + err));
        }

        function toggleLike(title, artist, btn) {
            if (!currentUser) {
                alert("Please log in to like songs.");
                switchMode('profile');
                return;
            }

            fetch('/api/like', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: title, artist: artist})
            }).then(r => r.json()).then(data => {
                if(data.success) {
                    if(data.action === 'liked') {
                        btn.innerHTML = '♥ Liked';
                        btn.classList.add('liked');
                    } else {
                        btn.innerHTML = '♡ Like';
                        btn.classList.remove('liked');
                    }
                }
            });
        }

        function loadLikes() {
            fetch('/api/my_likes').then(r => r.json()).then(data => {
                const el = document.getElementById('results');
                el.innerHTML = '';
                document.getElementById('results-title').classList.remove('hidden');
                
                if(data.likes.length === 0) {
                    el.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; border: 1px dashed var(--border-light);">
                            <p style="font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--text-muted); margin-bottom: 10px;">Your collection is empty</p>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">Hit the ♡ button on any song to save it here.</p>
                        </div>
                    `;
                    return;
                }
                
                data.likes.forEach(s => el.appendChild(createSongCard(s, false)));
            });
        }
    </script>
</body>
</html>
