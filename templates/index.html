<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Song Recommender</div>
        <div class="nav-links">
            <button id="btn-discover-mode" class="nav-btn active" onclick="switchMode('discover')">Discover</button>
            <button id="btn-recommend-mode" class="nav-btn" onclick="switchMode('recommend')">Get Similar Songs</button>
            <button id="btn-search-mode" class="nav-btn" onclick="switchMode('search')">Search Artists</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Recommendation Form -->
        <div id="recommend-form" class="card hidden">
            <h2>Find Similar Songs</h2>
            <p>Enter a song you love, and we'll find tracks that match its vibe.</p>
            <label for="song-title">Song Title</label>
            <input type="text" id="song-title" placeholder="e.g. Shape of You">
            <label for="count-input">How many results?</label>
            <input type="text" id="count-input" value="10">
            <button onclick="getRecommendations()">Recommend</button>
        </div>

        <!-- Search Form -->
        <div id="search-form" class="card hidden">
            <h2>Search by Artist</h2>
            <p>Find all songs by a specific artist in our database.</p>
            <label for="artist-search">Artist Name</label>
            <input type="text" id="artist-search" placeholder="e.g. Taylor Swift" onkeypress="if(event.key === 'Enter') searchByArtist()">
            <button onclick="searchByArtist()">Search</button>
        </div>

        <div id="message" class="hidden"></div>

        <!-- Results Area -->
        <div id="results-container">
            <h3 id="results-title" class="hidden">Discover New Music</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        // Initial load
        window.onload = () => {
            loadDiscoverFeed();
        };

        function switchMode(mode) {
            // Reset all nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + mode + '-mode').classList.add('active');
            
            // Hide all forms and clear results
            document.getElementById('recommend-form').classList.add('hidden');
            document.getElementById('search-form').classList.add('hidden');
            clearResults();

            // Show selected mode
            if(mode === 'discover') {
                loadDiscoverFeed();
            } else if(mode === 'recommend') {
                document.getElementById('recommend-form').classList.remove('hidden');
            } else if(mode === 'search') {
                document.getElementById('search-form').classList.remove('hidden');
            }
        }

        function clearResults() {
            document.getElementById('message').className = 'hidden';
            document.getElementById('results').innerHTML = '';
            document.getElementById('results-title').className = 'hidden';
        }

        function createSongCard(s) {
            const div = document.createElement('div');
            div.className = 'song-card';
            
            const scoreHtml = (s.score !== undefined) ? `<div class="score-badge">Score: ${s.score}/100</div>` : '';
            
            div.innerHTML = `
                <div class="song-info">
                    <h4>${s.title || 'Unknown Title'}</h4>
                    <div class="artist">${s.artist || 'Unknown Artist'}</div>
                    ${scoreHtml}
                </div>
            `;
            return div;
        }

        function loadDiscoverFeed() {
            clearResults();
            document.getElementById('results-title').textContent = "Discover New Music";
            document.getElementById('results-title').classList.remove('hidden');
            
            fetch('/api/discover')
                .then(r => r.json())
                .then(data => {
                    const resultsEl = document.getElementById('results');
                    if (data.success && data.results) {
                        data.results.forEach(s => resultsEl.appendChild(createSongCard(s)));
                    }
                });
        }

        function getRecommendations() {
            clearResults();
            const songTitle = document.getElementById('song-title').value.trim();
            const countRaw = document.getElementById('count-input').value.trim();

            if(!songTitle) {
                const msg = document.getElementById('message');
                msg.className = 'error';
                msg.textContent = "Please enter a song title.";
                return;
            }

            fetch('/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ song_title: songTitle, genre: "all", count: countRaw })
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    const msg = document.getElementById('message');
                    msg.className = 'error';
                    msg.textContent = data.error;
                    return;
                }
                
                document.getElementById('results-title').textContent = "Similar Songs";
                document.getElementById('results-title').classList.remove('hidden');
                const resultsEl = document.getElementById('results');
                data.results.forEach(s => resultsEl.appendChild(createSongCard(s)));
            });
        }

        function searchByArtist() {
            clearResults();
            const artist = document.getElementById('artist-search').value.trim();
            if(!artist) return;

            fetch('/api/search_artist?artist=' + encodeURIComponent(artist))
                .then(r => r.json())
                .then(data => {
                    document.getElementById('results-title').textContent = "Songs by " + artist;
                    document.getElementById('results-title').classList.remove('hidden');
                    const resultsEl = document.getElementById('results');
                    
                    if (data.results.length === 0) {
                        resultsEl.innerHTML = '<p style="color:#666; text-align:center; margin-top:20px;">No songs found for this artist.</p>';
                        return;
                    }
                    data.results.forEach(s => resultsEl.appendChild(createSongCard(s)));
                });
        }
    </script>
</body>
</html>
